<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Booking Form</title>
</head>
<body>
    <header class="navigation-bar">
        <img style="height: 75px; width: 165px;" src="./img/logo1.png">
        <nav class="nav-menu">
            <a href="Dashboard.html" class="nav-link">Beranda</a>
            <a href="Transportation.html" class="nav-link">Transportasi</a>
            <a href="AboutUs.html" class="nav-link">Tentang Kami</a>
            <a href="FormBooking.html" class="nav-link booking-btn">BOOKING SEKARANG</a>
        </nav>
    </header>

    <div class="form-booking">
        <div class="form-box">
            <h1 class="form-title">Formulir Reservasi Tour</h1>

            <form id="BookingForm" action="Success.html">

                <div class="data">
                    <label>NAMA : </label>
                    <input type="text" id="nama" required placeholder="Nama Lengkap">
                </div>

                <div class="data">
                    <label>NOMOR TELEPON : </label>
                    <input type="text" id="telp" required placeholder="Nomor Telepon">
                </div>

                <div class="data">
                    <label>TANGGAL : </label>
                    <input type="text" id="date" required placeholder="YY/MM/DD"">
                </div>

                <div class="data">
                    <label>JUMLAH PARTISIPAN : </label>
                    <input type="number" id="jumlah" required min="1" placeholder="Contoh : 3">
                </div>

                <div class="data">
                    <label>DESTINASI : </label>
                    <select id="PilihDest">
                        <option value="Pilih Destinasi/Paket">
                        <option value="DestinationA">TUR LEMBANG</option>
                        <option value="DestinationB">TUR PARAHYANGAN</option>
                        <option value="DestinationC">TUR PUSAT KOTA</option>
                        <option value="DestinationD">TUR BANDUNG SELATAN</option>
                        </option>
                    </select>
                </div>
				
				<div class="data">
                    <label>TRANSPORTASI : </label>
                    <select id="PilihDest">
                        <option value="Pilih Destinasi/Paket">
                        <option value="Transport1">MOBIL</option>
                        <option value="Transport2">BUS</option>
                        </option>
                    </select>
                </div>

                <div class="btn-area">
                    <a href="Dashboard.html" class="btn-back">KEMBALI</a> 
                    <button type="submit" class="btn-submit">BOOKING</button>
                </div>
            </form>
        </div>
    </div>

</body>

</html>
